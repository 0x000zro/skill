name: Auto-Generate Headless CMS Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'study/**'
      - 'revision/**'
      - 'practice/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Manifest Generator
        run: |
          python3 .github/scripts/generate_manifest.py

      - name: Commit and Push Updated Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cms): auto-update manifest.json [skip ci]"
          file_pattern: "manifest.json"
